services:
  # Single Unified Web Service running FastAPI Backend + Next.js Frontend together
  - type: web
    name: gait-analysis
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: gait_analysis
      - key: JWT_SECRET
        generateValue: true
